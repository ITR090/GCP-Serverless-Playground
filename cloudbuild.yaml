steps:
# Step 1: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/$PROJECT_ID/fullstackapp-repo/afp:$COMMIT_SHA',
      '.'
    ]

# Step 2: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/fullstackapp-repo/afp:$COMMIT_SHA'
    ]

# Step 3: Deploy to Cloud Run in us-central1
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    [
      'run',
      'deploy',
      'fullstackapp-afp',
      '--image',
      'us-central1-docker.pkg.dev/$PROJECT_ID/fullstackapp-repo/afp:$COMMIT_SHA',
      '--region',
      'us-central1',
      '--platform',
      'managed',
      '--allow-unauthenticated'
    ]

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/fullstackapp-repo/afp:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY